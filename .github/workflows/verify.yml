name: Verify
on:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    name: Code quality and dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: bash tools/check-workflows.sh
      - run: npm run test:dry-run
  browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser and OS dependencies
        run: npx --no-install playwright install --with-deps "${{ matrix.browser }}"
      - name: Chromium tests and coverage thresholds
        if: matrix.browser == 'chromium'
        run: npm run test:coverage
        env:
          SERVE_DIR: dist
      - name: Firefox and WebKit tests
        if: matrix.browser != 'chromium'
        run: npx --no-install playwright test --project="${{ matrix.browser }}"
        env:
          SERVE_DIR: dist
      - name: Preserve reports, traces, screenshots, videos, and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
            coverage/
          retention-days: 14
          if-no-files-found: warn
  package:
    name: Package verified site
    needs: [quality, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
