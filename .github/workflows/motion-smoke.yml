name: Motion smoke tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motion-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser smoke (15 iterations)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install pinned browser test tools
        env:
          NODE_PATH: ${{ runner.temp }}/motion-tests/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/motion-tests" --no-package-lock --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/motion-tests/node_modules/playwright/cli.js" install --with-deps chromium
          printf 'CHROMIUM_PATH=%s\n' "$(node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_ENV"
      - name: Check all designs and navigation
        env:
          NODE_PATH: ${{ runner.temp }}/motion-tests/node_modules
          SCREENSHOT_DIR: ${{ runner.temp }}/motion-screenshots
        run: node tests/motion-smoke.cjs
